<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>팜펫 도우미</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
:root{--ink:#1c2b22;--soft:#5d7064;--line:#e3ece5;--green:#2f9e5f;--green-d:#1f7a47;--green-s:#e6f6ec;--bg:#f5faf6;--card:#fff;
--shadow:0 1px 2px rgba(28,43,34,.05),0 14px 34px -14px rgba(28,43,34,.22)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,"Malgun Gothic",sans-serif;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:520px;z-index:-1;
background:radial-gradient(800px 400px at 10% -10%,#d3f0de,transparent 60%),radial-gradient(700px 380px at 92% -20%,#fde9c9,transparent 60%)}
.wrap{max-width:1100px;margin:0 auto;padding:0 24px}
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.75);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;height:64px}
.logo{font-weight:800;font-size:19px;display:flex;gap:9px;align-items:center}
.logo i{font-style:normal;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(140deg,var(--green),#6fd09a)}
.hero{text-align:center;padding:36px 0 16px}
.hero h1{font-size:clamp(26px,5vw,40px);letter-spacing:-.03em;line-height:1.25;margin:0 0 10px}
.hero h1 em{font-style:normal;color:var(--green)}
.hero p{color:var(--soft);max-width:560px;margin:0 auto;font-size:16px}
.main{padding:18px 0 24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
.chat{position:relative;height:min(680px,calc(100dvh - 120px));min-height:480px;overflow:hidden}
.chat .loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--soft);font-weight:600}
.chat iframe{position:relative;width:100%;height:100%;border:0;background:transparent}
.notice{max-width:720px;margin:0 auto 8px;padding:12px 16px;border-radius:14px;background:#fff3e0;color:#7a4b00;font-size:14px;text-align:center}
footer{text-align:center;color:var(--soft);font-size:13px;padding:20px 0 40px}
</style>
</head>
<body>
<header><div class="wrap nav">
  <div class="logo"><i>🌿</i>팜펫 도우미</div>
</div></header>

<div class="wrap">
  <section class="hero">
    <h1>우리 아이 건강, <em>팜펫 도우미</em>에게 물어보세요</h1>
    <p>반려동물의 증상, 식사, 생활 습관에 대해 궁금한 점을 편하게 질문해 보세요.</p>
  </section>

  <section class="main" id="chat">
    <div class="card chat">
      <div class="loading">채팅을 불러오는 중입니다…</div>
      <iframe
        src="https://copilotstudio.microsoft.com/environments/cfe472a7-8d6b-e57d-9381-81572ac35b9d/bots/cr72a_aicreativeagentteam_4qzqPa/webchat?version=2&enableFileAttachment=true&cliAgent=true"
        title="팜펫 도우미 채팅" loading="lazy"></iframe>
    </div>
  </section>

  <div class="notice">⚠️ 응급 상황이거나 증상이 심하면 챗봇 대신 즉시 동물병원을 방문하세요.</div>
  <footer>© 팜펫 도우미 · 실제 반려동물 건강 문제는 수의사와 상담하세요.</footer>
</div>
</body>
</html>
